{% extends 'store/main.html' %}
{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="box-element p-4">

                <h2 class="text-center mb-4">
                    Create Your Account
                </h2>
                {% if error %}

<div class="alert alert-danger">

    {{error}}

</div>

{% endif %}

                <form method="POST">

                    {% csrf_token %}

                    <div class="form-group mb-3">

                        <label>Username</label>

                        <input type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter username"
                        required>

                    </div>

                    <div class="form-group mb-3">

                        <label>Password</label>

                        <input type="password"
                        name="password1"
                        class="form-control"
                        placeholder="Enter password"
                        required>

                    </div>

                    <div class="form-group mb-3">

                        <label>Confirm Password</label>

                        <input type="password"
                        name="password2"
                        class="form-control"
                        placeholder="Confirm password"
                        required>

                    </div>

                    <button type="submit"
                    class="btn btn-success btn-block w-100">

                    Register

                    </button>

                </form>

                <br>

                <p class="text-center">

                    Already have an account?

                    <a href="{% url 'login' %}">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock content %}
